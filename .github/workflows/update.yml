name: Daily News Update

# Triggered externally by cron-job.org (reliable and daylight-saving-safe) at the five
# daily Eastern-time slots — 9:50 & 11:50 AM, 2:50, 4:50 & 6:50 PM ET — and manually from
# the Actions tab. cron-job.org POSTs to this workflow's dispatch API.
#
# NOTE: GitHub's own `schedule:` cron and the clock-"gate" job were REMOVED on 2026-08-06.
# Scheduling 10 UTC cron lines per day (two per ET slot for DST) plus a gate job that spun
# up a runner just to check the time overloaded GitHub's queue for this repo, so GitHub
# began cancelling the gate jobs — which sent "some jobs were not successful" failure
# emails and left the site un-updated. cron-job.org already fires at the exact ET times,
# so the GitHub schedule was redundant. If cron-job.org ever stops, re-add a schedule.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run aggregator
        run: python scripts/aggregate.py

      - name: Commit & push updated HTML
        run: |
          git config user.name  "BlueWaveBot"
          git config user.email "bot@bluewavebeacon.com"
          git add index.html politics.html climate.html economy.html feed.xml sitemap.xml archive.html archive/ substack_cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: daily feed update $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Push with rebase + retry to survive races with any concurrent commits
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying in 5s..."
            sleep 5
          done
          echo "All push attempts failed." >&2
          exit 1
